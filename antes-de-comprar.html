<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#f5f0e6; --tarjeta:#ffffff; --texto:#1c1c1a; --verde:#1f4f3d;
  --acento:#b8461a; --acento-texto:#ffffff; --bloque:#1f4f3d; --bloque-texto:#ffffff;
  --bloque-acento:#e9b27a; --borde:#1f4f3d; --linea:rgba(255,255,255,.2);
  --velo:rgba(245,240,230,.86); --velo-cab:rgba(245,240,230,.94); --sombra:rgba(20,40,30,.18);
}
:root[data-tema="oscuro"]{
  --fondo:#121815; --tarjeta:#1c2621; --texto:#ece8df; --verde:#8fd1b0;
  --acento:#e0703f; --acento-texto:#121815; --bloque:#0b2a1e; --bloque-texto:#f1ede4;
  --bloque-acento:#e9b27a; --borde:#8fd1b0; --linea:rgba(255,255,255,.18);
  --velo:rgba(14,20,17,.84); --velo-cab:rgba(10,16,13,.92); --sombra:rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0}
html{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}
body{background:var(--fondo);color:var(--texto);font-family:"Inter",system-ui,sans-serif;line-height:1.5;transition:background .25s,color .25s}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;color:var(--verde);line-height:1.1}
.pagina{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 110px}

/* Encabezado */
.encabezado{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:36px}
.etiqueta{color:var(--acento);font-weight:700;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px}
.encabezado h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;max-width:14em}
.intro{margin-top:16px;max-width:42em;font-size:1.1rem}
.logo{height:var(--alto-logo,4.5rem);width:auto;max-width:100%;flex-shrink:0}

/* Portada */
.portadas{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.portada{display:flex;flex-direction:column;gap:14px}
.portada .foto{display:block;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--tarjeta);border:2px solid var(--borde)}
.portada img{width:100%;height:100%;object-fit:cover;display:block}
.boton{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:1.1rem;padding:14px 18px;border-radius:14px;background:var(--acento);color:var(--acento-texto);transition:filter .2s}
.boton:hover{filter:brightness(1.1)}
a:focus-visible,button:focus-visible{outline:3px solid var(--bloque-acento);outline-offset:3px}

/* Subpáginas */
.volver{display:inline-block;margin-bottom:24px;color:var(--verde);font-weight:600;text-decoration:none}
.volver:hover{text-decoration:underline}
.tarjeta{background:var(--tarjeta);border-radius:22px;padding:clamp(22px,4vw,40px);max-width:640px}
.tarjeta h2{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:24px}
.pasos{list-style:none;padding:0;display:grid;gap:20px}
.pasos li{display:flex;gap:16px;align-items:center;font-size:1.15rem}
.num{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--acento);color:var(--acento-texto);display:grid;place-items:center;font-weight:700}

.desinfeccion{background:var(--bloque);color:var(--bloque-texto);border-radius:22px;padding:clamp(22px,4vw,40px);margin-top:28px}
.desinfeccion .etiqueta{color:var(--bloque-acento)}
.desinfeccion h2{color:var(--bloque-texto);font-size:clamp(1.8rem,4.5vw,2.8rem);margin-bottom:24px}
.fases{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.fases .n{display:block;font-family:"Fraunces",Georgia,serif;font-size:2rem;color:var(--bloque-acento);margin-bottom:6px}
.aviso{margin-top:24px;padding-top:18px;border-top:1px solid var(--linea)}

.guardado{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.caja{border:2px solid var(--borde);border-radius:20px;padding:24px}
.caja h3{font-size:1.6rem;margin-bottom:10px}

/* Modo oscuro */
.modo{position:fixed;right:20px;bottom:20px;z-index:10;border:2px solid var(--borde);background:var(--tarjeta);color:var(--verde);font:600 .95rem "Inter",sans-serif;padding:12px 18px;border-radius:999px;cursor:pointer}
.modo:hover{filter:brightness(1.08)}

@media (max-width:820px){
  .portadas,.guardado{grid-template-columns:1fr}
  .fases{grid-template-columns:repeat(2,1fr)}
  .portada .foto{aspect-ratio:16/10}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Páginas internas: mismo estilo que la portada ===== */
html{background:var(--fondo)}
body.interna{background:transparent}
body.interna::before{content:"";position:fixed;inset:-30px;z-index:-1;background:var(--foto) center/cover no-repeat;filter:blur(14px)}
body.interna::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--velo)}
.interna .cabecera{--alto-logo:clamp(3rem,6.6vw,4.8rem);position:static;padding:0 0 32px;background:none;pointer-events:auto}
.interna .cabecera h1{font-size:clamp(1.6rem,3.6vw,2.6rem);margin-bottom:22px}
.interna .cabecera{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;color:var(--texto)}
.interna .cabecera h1{color:var(--verde)}
.logos{display:flex;gap:18px;align-items:center;flex-shrink:0}
.cinta{position:relative;z-index:1;text-align:center;font-family:"Fraunces",Georgia,serif;font-weight:800;color:var(--verde);background:var(--tarjeta);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%,16px 50%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
a.cinta:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.cinta-volver{display:inline-block;width:auto;min-width:0;padding:12px 40px;font-size:1rem;text-decoration:none}
.interna .cinta-volver:hover{filter:drop-shadow(0 4px 10px rgba(0,0,0,.3)) brightness(1.06)}
.interna .tarjeta,.interna .tarjeta-ancha{box-shadow:0 10px 30px var(--sombra)}
.tarjeta-ancha{background:var(--tarjeta);border-radius:22px;padding:clamp(22px,4vw,40px)}
.tarjeta-ancha h2{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:24px}
@media (max-width:820px){.interna .cabecera{flex-direction:column}}
:root[data-tema="oscuro"] .logos{background:#f5f0e6;padding:8px 16px;border-radius:14px}

/* ===== Foto de historia (se amplía al presionar) ===== */
.historia{margin-top:28px;width:100%;max-width:820px}
.historia-miniatura{display:block;width:fit-content;max-width:100%;padding:0;border:0;border-radius:22px;overflow:hidden;background:var(--tarjeta);cursor:zoom-in;line-height:0;box-shadow:0 10px 30px var(--sombra);transition:filter .2s}
.historia-miniatura:hover{filter:brightness(1.06)}
.historia-miniatura img{display:block;width:auto;height:auto;max-width:100%;max-height:80vh}
.visor{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--velo-cab);cursor:zoom-out;opacity:0;transition:opacity .2s}
.visor[hidden]{display:none}
.visor.abierto{opacity:1}
.visor button{border:0;padding:0;background:none;cursor:zoom-out;line-height:0}
.visor img{max-width:94vw;max-height:92vh;object-fit:contain;border-radius:16px;box-shadow:0 14px 40px var(--sombra);transform:scale(.92);transition:transform .2s}
.visor.abierto img{transform:scale(1)}
</style>
<script>try{if(localStorage.getItem("bpm-tema")==="oscuro")document.documentElement.setAttribute("data-tema","oscuro")}catch(e){}</script>
<title>Antes de comprar · BPM</title>
</head>
<body class="interna" style="--foto:url('Imagenes/portada_1_png.png')">
<main class="pagina">
  <header class="cabecera">
    <div>
      <p class="etiqueta">BPM · Buenas Prácticas de Manufactura</p>
      <h1>Cuida tus alimentos antes y después de comprar</h1>
      <a class="cinta cinta-volver" href="index.html">← Volver al inicio</a>
    </div>
    <div class="logos">
      <img class="logo" src="Imagenes/universidad_logo_png.png" alt="Logo de la universidad">
      <img class="logo" src="Imagenes/municipalidad_logo_png.png" alt="Logo de la municipalidad" onerror="this.remove()">
    </div>
  </header>
  <section class="tarjeta">
    <h2>Antes de comprar</h2>
    <ol class="pasos">
      <li><span class="num">1</span>Lleva bolsas y hieleras limpias.</li>
      <li><span class="num">2</span>Elige productos frescos, sin golpes ni mal olor.</li>
      <li><span class="num">3</span>Compra carnes y mariscos al final y sepáralos del resto.</li>
    </ol>
  </section>
  <section class="historia">
    <button class="historia-miniatura" id="historia-btn" type="button" aria-haspopup="dialog" aria-label="Ampliar foto">
      <img src="Imagenes/historia_pelu_1_png.png" alt="Foto de la sección">
    </button>
  </section>
</main>
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button type="button" aria-label="Reducir foto"><img src="Imagenes/historia_pelu_1_png.png" alt="Foto de la sección ampliada"></button>
</div>
<button class="modo" id="modo" type="button">☾ Modo oscuro</button>
<script>
(function () {
  var raiz = document.documentElement;
  var boton = document.getElementById("modo");
  function aplicar(t) {
    if (t === "oscuro") { raiz.setAttribute("data-tema", "oscuro"); }
    else { raiz.removeAttribute("data-tema"); }
    if (boton) {
      boton.textContent = t === "oscuro" ? "☀ Modo claro" : "☾ Modo oscuro";
      boton.setAttribute("aria-pressed", t === "oscuro");
    }
  }
  var guardado = null;
  try { guardado = localStorage.getItem("bpm-tema"); } catch (e) {}
  aplicar(guardado === "oscuro" ? "oscuro" : "claro");
  if (boton) boton.addEventListener("click", function () {
    var nuevo = raiz.getAttribute("data-tema") === "oscuro" ? "claro" : "oscuro";
    aplicar(nuevo);
    try { localStorage.setItem("bpm-tema", nuevo); } catch (e) {}
  });
})();
</script>
<script>
(function () {
  var mini = document.getElementById("historia-btn");
  var visor = document.getElementById("visor");
  if (!mini || !visor) return;
  function abrir() {
    visor.hidden = false;
    requestAnimationFrame(function () { visor.classList.add("abierto"); });
    document.body.style.overflow = "hidden";
    visor.querySelector("button").focus();
  }
  function cerrar() {
    visor.classList.remove("abierto");
    document.body.style.overflow = "";
    setTimeout(function () { visor.hidden = true; }, 200);
    mini.focus();
  }
  mini.addEventListener("click", abrir);
  visor.addEventListener("click", cerrar);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !visor.hidden) cerrar();
  });
})();
</script>
</body>
</html>
